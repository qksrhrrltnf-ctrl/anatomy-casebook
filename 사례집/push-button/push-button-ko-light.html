.edu-switch-knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--anatomy-text);transition:transform .2s var(--anatomy-ease),background .2s}
.edu-switch[aria-checked="true"] .edu-switch-track{background:var(--anatomy-strong)}
.edu-switch[aria-checked="true"] .edu-switch-knob{transform:translateX(16px);background:var(--anatomy-card)}
.edu-switch-label{flex:1;font-size:14px;font-weight:600;color:var(--anatomy-strong)}
.edu-switch-state{font-size:13px;color:var(--anatomy-text)}

.edu-segs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;padding:3px;border-radius:8px;background:var(--edu-soft);box-shadow:inset 0 0 0 1px var(--edu-line)}
.edu-seg{appearance:none;padding:8px 6px;border:0;border-radius:6px;background:transparent;color:var(--anatomy-text);font:600 13px/1.3 var(--edu-font);cursor:pointer}
.edu-seg:hover{color:var(--anatomy-strong)}
.edu-seg[aria-checked="true"]{background:var(--anatomy-card);color:var(--anatomy-strong);box-shadow:0 0 0 1px var(--anatomy-mid)}

.edu-block{margin-top:20px;padding-top:16px;border-top:1px solid var(--edu-line)}
.edu-block-title{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--anatomy-text)}
.edu-formulas{display:grid;gap:8px;margin:0}
.edu-formula{display:grid;gap:3px;padding:9px 11px;border-radius:6px;background:var(--edu-soft)}
.edu-formula dt{font-size:12.5px;color:var(--anatomy-text)}
.edu-formula dd{margin:0;font:500 14px/1.5 var(--anatomy-mono);font-variant-numeric:tabular-nums;color:var(--anatomy-strong)}

.edu-btn{appearance:none;padding:9px 14px;border:1px solid var(--edu-line);border-radius:6px;background:transparent;color:var(--anatomy-strong);font:600 13px/1.2 var(--edu-font);cursor:pointer}
.edu-btn:hover{background:var(--edu-soft)}
.edu-btn:disabled{opacity:.35;cursor:default;background:transparent}
.edu-btn-main{border-color:var(--anatomy-strong);background:var(--anatomy-strong);color:var(--anatomy-card)}
.edu-btn-main:hover{background:color-mix(in srgb,var(--anatomy-strong) 85%,var(--anatomy-card))}
.edu-btn-main:disabled{background:transparent;color:var(--anatomy-strong);border-color:var(--edu-line)}
.edu-action{width:100%;padding:11px 14px;font-size:14px}
.edu-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

.edu-step-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.edu-step-count{margin:0;font:600 12px/1 var(--anatomy-mono);letter-spacing:.06em;color:var(--anatomy-text);white-space:nowrap}
.edu-dots{display:flex;flex-wrap:wrap;justify-content:flex-end}
.edu-dot{display:grid;place-items:center;width:22px;height:22px;padding:0;border:0;background:none;cursor:pointer}
.edu-dot::before{content:"";width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--anatomy-mid)}
.edu-dot[data-done]::before{background:var(--anatomy-mid)}
.edu-dot[aria-current]::before{width:10px;height:10px;background:var(--anatomy-strong);box-shadow:none}
.edu-step-title{margin:14px 0 8px;font-size:18px;line-height:1.45;color:var(--anatomy-strong)}
.edu-step-title:focus{outline:none}
.edu-step-text{margin:0;font-size:15px;line-height:1.8;color:var(--edu-body)}
.edu-chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:14px 0 0}
.edu-chip-label{margin-right:2px;font-size:12px;color:var(--anatomy-text)}
.edu-chip{padding:3px 9px;border-radius:999px;background:var(--edu-soft);box-shadow:inset 0 0 0 1px var(--edu-line);color:var(--anatomy-strong);font-size:12px}
.edu-step-nav{display:flex;justify-content:space-between;gap:8px;margin-top:20px}

.edu-q{padding:16px 0 18px;border-top:1px solid var(--edu-line)}
.edu-q:last-child{padding-bottom:0}
.edu-q-num{margin:0 0 4px;font:600 12px/1.2 var(--anatomy-mono);letter-spacing:.06em;color:var(--anatomy-text)}
.edu-q-text{margin:0 0 12px;font-size:15px;font-weight:600;line-height:1.65;color:var(--anatomy-strong)}
.edu-choices{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.edu-choice{position:relative;padding:10px 26px 10px 11px;border:1px solid var(--edu-line);border-radius:6px;background:transparent;color:var(--anatomy-strong);font:500 14px/1.35 var(--edu-font);text-align:left;cursor:pointer}
.edu-choice:hover{background:var(--edu-soft)}
.edu-choice[aria-disabled]{cursor:default}
.edu-choice[aria-disabled]:hover{background:transparent}
.edu-choice[aria-disabled]:not([data-state]){opacity:.55}
.edu-choice[data-state="right"]{border-color:var(--edu-ok);box-shadow:inset 0 0 0 1px var(--edu-ok)}
.edu-choice[data-state="wrong"]{border-color:var(--edu-bad);box-shadow:inset 0 0 0 1px var(--edu-bad)}
.edu-choice[data-state]::after{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-weight:700}
.edu-choice[data-state="right"]::after{content:"✓";color:var(--edu-ok)}
.edu-choice[data-state="wrong"]::after{content:"✕";color:var(--edu-bad)}
.edu-q-result:empty{display:none}
.edu-q-result{margin-top:12px}
.edu-q-result p{margin:0}
.edu-q-wait{font-size:13px;color:var(--anatomy-text)}
.edu-q-verdict{font-size:14px;font-weight:700}
.edu-q-verdict[data-right="true"]{color:var(--edu-ok)}
.edu-q-verdict[data-right="false"]{color:var(--edu-bad)}
.edu-q-explain{margin-top:6px!important;font-size:14px;line-height:1.75;color:var(--edu-body)}

.edu-parts{display:grid;gap:2px;margin:0;padding:0;list-style:none}
.edu-part{display:grid;gap:2px;width:100%;padding:9px 10px;border:0;border-radius:6px;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer}
.edu-part:hover{background:var(--edu-soft)}
.edu-part[aria-pressed="true"]{background:var(--edu-soft);box-shadow:inset 3px 0 0 var(--anatomy-strong)}
.edu-part-name{font-size:14px;font-weight:600;color:var(--anatomy-strong)}
.edu-part-say{font-size:13px;line-height:1.6;color:var(--anatomy-text)}

@media (max-width:1000px){
  .edu-layout{grid-template-columns:minmax(0,1fr);gap:0}
  .edu-panel{position:static;max-height:none;margin-top:20px}
  .edu-tabs{position:static}
}

}
@media (prefers-reduced-motion:reduce){
  .edu *,.edu *::before,.edu *::after{transition:none!important}
}

.pb-glass{fill:var(--anatomy-paper);fill-opacity:.55;stroke:var(--anatomy-hi);stroke-width:var(--anatomy-weight);vector-effect:non-scaling-stroke;transition:fill .25s var(--anatomy-ease),fill-opacity .25s var(--anatomy-ease)}
.pb-glow{opacity:var(--pb-on,0);pointer-events:none;mix-blend-mode:var(--pb-blend,screen)}
.pb-stop-0{stop-color:var(--pb-glow-0)}.pb-stop-1{stop-color:var(--pb-glow-1)}.pb-stop-2{stop-color:var(--pb-glow-2)}
.iso{--pb-glow-0:#ffd98a;--pb-glow-1:#ffb84a55;--pb-glow-2:#ff9d2a00;--pb-hot:#ffd98a}
.iso[data-theme="light"]{--pb-glow-0:#ffcf6a;--pb-glow-1:#ffb84a40;--pb-glow-2:#ff9d2a00;--pb-hot:#e08a12;--pb-blend:multiply}

.iso-stage:not([data-flow]) .pb-charges{display:none}
.iso-stage{cursor:pointer;touch-action:manipulation}

n class="iso-key"><svg class="iso-swatch" data-mark="blue" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>파란 점: 전선 속 전자, 전류와 반대 방향으로 움직입니다</span></span><span class="iso-caption">전지와 작은 전구를 누름 버튼과 함께 하나의 고리로 이었습니다. 용수철이 구리 다리판을 두 접점 기둥 위로 띄워 두므로 평소에는 열린 회로입니다. 누름단추를 누르면 다리판이 두 기둥에 닿아 닫힌 회로가 됩니다. 지금 값(전압 1.5 V, 전구 저항 5 Ω)에서는 닫혔을 때 0.30 A의 전류가 흐르고 전구의 전력은 0.45 W입니다. 지금 회로: 열린 회로. 손을 떼면 용수철이 다리판을 다시 들어 올립니다.</span></figcaption></figure></div><aside class="edu-panel" data-edu-panel aria-label="학습 패널"></aside></div><footer class="edu-foot">모델: 전구 저항은 온도와 관계없이 일정하다고 가정합니다(실제 필라멘트는 뜨거워질수록 저항이 커집니다). 전자의 이동 속도는 실제보다 훨씬 빠르게 그렸고, 점의 속도는 전류에 비례합니다.</footer></div><script type="application/json" id="edu-content">{"lang":"ko","page":{"title":"누름 버튼 · 교육판","kicker":"중학교 2학년 과학 · 전기와 자기","heading":"누름 버튼과 닫힌 회로","lead":"전지는 끊어진 곳 없이 고리처럼 이어진 닫힌 회로에서만 전류를 흐르게 합니다. 누름 버튼은 그 고리 중간에 있는 작은 틈입니다. 그림을 누르거나 학습 패널에서 전압과 저항을 바꾸어 전류와 전구 밝기가 어떻게 달라지는지 확인해 보십시오.","footer":"모델: 전구 저항은 온도와 관계없이 일정하다고 가정합니다(실제 필라멘트는 뜨거워질수록 저항이 커집니다). 전자의 이동 속도는 실제보다 훨씬 빠르게 그렸고, 점의 속도는 전류에 비례합니다."},"card":{"fig":"그림 1","title":"누름 버튼","hint":"누르고 있기","readout":"열림 · 0 A","keys":[{"mark":"lit","label":"누름단추와 구리 다리판: 누르면 움직이는 부분"},{"mark":"raised","label":"접점 기둥 두 개: 다리판이 닫는 틈"},{"mark":"blue","label":"파란 점: 전선 속 전자, 전류와 반대 방향으로 움직입니다"}],"caption":"전지와 작은 전구를 누름 버튼과 함께 하나의 고리로 이었습니다. 용수철이 구리 다리판을 두 접점 기둥 위로 띄워 두므로 평소에는 열린 회로입니다. 누름단추를 누르면 다리판이 두 기둥에 닿아 닫힌 회로가 됩니다. 지금 값(전압 {V}, 전구 저항 {R})에서는 닫혔을 때 {I}의 전류가 흐르고 전구의 전력은 {P}입니다. 지금 회로: {circuit}. 손을 떼면 용수철이 다리판을 다시 들어 올립니다."},"keep":[".pb-glow"],"questionDelay":1400,"start":"params","parts":[{"id":"cap","name":"누름단추","say":"손가락으로 누르는 부분입니다. 아래의 막대와 구리 다리판을 함께 밀어 내립니다.","select":"[data-piece=\"cap\"]"},{"id":"spring","name":"되돌림 용수철","say":"누르지 않을 때 다리판을 들어 올려 회로를 열어 둡니다. 손을 떼면 다리판을 다시 올립니다.","select":"[data-piece=\"spring\"]"},{"id":"bridge","name":"구리 다리판","say":"전기가 잘 통하는 구리판입니다. 두 접점 기둥에 함께 닿으면 틈을 이어 회로를 닫습니다.","select":"[data-piece=\"bridge\"]"},{"id":"contacts","name":"접점 기둥","say":"회로가 끊어진 두 끝입니다. 다리판이 두 기둥에 닿아야 전류가 지나갑니다.","select":"[data-piece=\"contacts\"]"},{"id":"frame","name":"틀과 받침","say":"전기가 통하지 않는 절연체입니다. 막대가 곧게 오르내리도록 잡아 줍니다.","select":"[data-piece=\"frame\"]"},{"id":"cell","name":"전지","say":"{V}의 전압으로 회로에 전류를 흐르게 합니다. 위쪽 볼록한 단자가 (+)극입니다.","select":"[data-piece=\"cell\"]"},{"id":"bulb","name":"전구","say":"가는 필라멘트에 전류가 흐르면 뜨거워져 빛이 납니다. 저항 {R}, 정격 전력 {Pr}입니다.","select":"[data-piece=\"bulb\"]"},{"id":"wires","name":"전선","say":"전지, 스위치, 전구를 하나의 고리로 잇는 길입니다. 고리가 한 군데라도 끊기면 전류가 흐르지 않습니다.","select":"[data-piece=\"wires\"]"}],"paramsIntro":"값을 바꾸면 그림과 판독값이 바로 바뀝니다. 그림을 눌러 회로를 닫아 보십시오.","params":[{"id":"V","type":"range","label":"전지 전압 V","unit":"V","min":1.5,"max":9,"step":0.5,"value":1.5,"digits":1,"help":"1.5 V 전지를 2개 직렬로 이으면 3 V입니다."},{"id":"R","type":"range","label":"전구 저항 R","unit":"Ω","min":2,"max":20,"step":1,"value":5,"digits":0},{"id":"mode","type":"choice","label":"스위치 종류","value":"momentary","options":[{"value":"momentary","label":"순간 스위치"},{"value":"latch","label":"유지(걸쇠) 스위치"}],"help":"순간 스위치는 누르는 동안만, 유지 스위치는 한 번 누르면 다시 누를 때까지 닫혀 있습니다."},{"id":"flow","type":"toggle","label":"전자 이동 보기","value":true,"on":"켬","off":"끔"},{"id":"tap","type":"action","label":"누름단추 한 번 누르기","help":"순간 스위치는 잠깐 켜졌다 꺼지고, 유지 스위치는 켜짐과 꺼짐이 바뀝니다."}],"formulasTitle":"공식으로 계산한 값","formulas":[{"label":"전류 (스위치를 닫았을 때)","text":"I = V ÷ R = {V} ÷ {R} = {I}"},{"label":"전력 (전구 밝기)","text":"P = V × I = {V} × {I} = {P}"},{"label":"지금 흐르는 전류","text":"{Inow} · {circuit}"}],"formulaNote":"전구의 정격 전력은 {Pr}입니다. 이보다 큰 전력이 걸리면 필라멘트가 너무 뜨거워져 끊어질 수 있습니다.","steps":[{"title":"열린 회로","text":"용수철이 구리 다리판을 두 접점 기둥 위로 띄워 둡니다. 회로 중간에 틈이 있으니 열린 회로입니다. 전자는 전선 속에 있지만 움직이지 않습니다. 지금 전류는 {Inow}입니다.","focus":["spring","bridge","contacts"],"pose":{"V":1.5,"R":5,"mode":"momentary","pressed":false}},{"title":"누름단추를 누릅니다","text":"누름단추를 누르면 막대와 다리판이 함께 내려가고 용수철이 줄어듭니다. 다리판이 아직 기둥에 닿지 않아 전류는 흐르지 않습니다.","focus":["cap","spring"],"pose":{"V":1.5,"R":5,"mode":"momentary","pressed":0.55}},{"title":"다리판이 기둥에 닿습니다","text":"다리판이 두 기둥에 동시에 닿습니다. 구리는 전기가 잘 통하므로 틈이 이어져 닫힌 회로가 됩니다.","focus":["bridge","contacts"],"pose":{"V":1.5,"R":5,"mode":"momentary","pressed":true}},{"title":"전류가 흐릅니다","text":"전지가 {V}의 전압으로 회로 전체에 전류를 흐르게 합니다. 전류의 세기는 I = V ÷ R = {V} ÷ {R} = {I}입니다. 전류는 전지의 (+)극에서 나와 (−)극으로 들어갑니다. 파란 점(전자)은 그 반대 방향으로 움직입니다.","focus":["cell","wires"],"pose":{"V":1.5,"R":5,"mode":"momentary","pressed":true,"flow":true}},{"title":"전구가 켜집니다","text":"전류가 전구의 가는 필라멘트를 지나면 필라멘트가 뜨거워져 빛을 냅니다. 이때 전구의 전력은 P = V × I = {V} × {I} = {P}입니다.","focus":["bulb"],"pose":{"V":1.5,"R":5,"mode":"momentary","pressed":true}},{"title":"손을 떼면","text":"손을 떼면 용수철이 다리판을 다시 들어 올립니다. 회로가 열려 전구가 꺼집니다. 이런 스위치를 순간 스위치라고 합니다. 유지(걸쇠) 스위치는 손을 떼도 닫힌 상태가 그대로 남습니다.","focus":["spring","bridge"],"pose":{"V":1.5,"R":5,"mode":"momentary","pressed":false}},{"title":"전류가 너무 크면","text":"전압을 {V}로 높이면 전류는 {I}, 전력은 {P}가 됩니다. 정격 전력 {Pr}보다 훨씬 커서 필라멘트가 녹아 끊어집니다. 필라멘트가 끊어지면 회로가 다시 열려 전류가 흐르지 않습니다.","focus":["bulb"],"pose":{"V":6,"R":5,"mode":"momentary","pressed":true}}],"questions":[{"q":"전압을 2배(1.5 V → 3 V)로 높이면 전구의 전력, 곧 밝기는 어떻게 됩니까?","choices":[{"label":"2배"},{"label":"4배","correct":true},{"label":"그대로"},{"label":"절반"}],"from":{"V":1.5,"R":5,"mode":"momentary","pressed":true},"to":{"V":3,"R":5,"mode":"momentary","pressed":true},"focus":["bulb"],"explain":"전압이 2배가 되면 전류도 2배가 됩니다. 그래서 P = V × I는 2 × 2 = 4배입니다. 식으로 쓰면 P = V² ÷ R입니다. 그림의 값: {from.P} → {to.P} ({ratio.P})"},{"q":"전압은 3 V 그대로 두고 전구 저항을 5 Ω에서 10 Ω으로 바꾸면 전류는 어떻게 됩니까?","choices":[{"label":"2배"},{"label":"절반","correct":true},{"label":"그대로"},{"label":"0 A"}],"from":{"V":3,"R":5,"mode":"momentary","pressed":true},"to":{"V":3,"R":10,"mode":"momentary","pressed":true},"focus":["bulb","wires"],"explain":"I = V ÷ R이므로 저항이 2배가 되면 전류는 절반이 됩니다. 그림의 값: {from.I} → {to.I} ({ratio.I}). 전류가 줄어 전구도 어두워집니다."},{"q":"유지(걸쇠) 스위치로 바꾸고 누름단추를 한 번 눌렀다 뗍니다. 전구는 어떻게 됩니까?","choices":[{"label":"바로 꺼진다"},{"label":"켜진 채로 있다","correct":true}],"from":{"V":1.5,"R":5,"mode":"latch","pressed":false},"to":{"tap":true},"focus":["cap","bridge"],"explain":"걸쇠가 다리판을 아래에 붙잡아 두어 손을 떼도 닫힌 회로가 유지됩니다. 손을 뗀 뒤 흐르는 전류: {to.Iend}. 한 번 더 누르면 걸쇠가 풀려 회로가 열립니다."}]}</script></main><script type="module">// edu-kit runtime: Korean teaching layer for Anatomy figures.
// Inlined before the figure's live script; defines one global, EDU. See edu/kit/README.md.
const EDU = (() => {
  const still = matchMedia("(prefers-reduced-motion: reduce)");
  const mounted = new WeakMap(); // stage → handle, so a second mount on the same stage is ignored
  const UI = {
    tabsLabel: "학습 도구",
    tabs: { params: "실험", steps: "단계", questions: "질문", parts: "부품" },
    formulas: "공식으로 계산한 값",
    reset: "처음 값으로",
    autoplay: "자동 재생",
    autoplayHelp: "그림이 스스로 움직이며 원리를 보여 줍니다. 그림이나 패널을 조작하면 꺼집니다.",
    step: "단계",
    prev: "이전",
    next: "다음",
    stepFocus: "강조한 부품",
    stepPick: "단계 고르기",
    partsHint: "부품을 누르면 그림에서 강조합니다. 한 번 더 누르면 풀립니다.",
    question: "질문",
    questionsHint: "먼저 예측하고 답을 고르십시오. 그림이 그 조건으로 바뀌어 답을 확인시켜 줍니다.",
    checking: "그림으로 확인하는 중입니다…",
    correct: "정답입니다.",
    wrong: "아쉽습니다. 정답은 ‘{answer}’입니다.",
    retry: "다시 풀기",
    replay: "다시 보기",
  };

  const h = (tag, attrs = {}, ...kids) => {
    const el = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs)) {
      if (value === undefined || value === null || value === false) continue;
      if (key === "class") el.className = value;
      else if (key.startsWith("on")) el.addEventListener(key.slice(2), value);
      else el.setAttribute(key, value === true ? "" : String(value));
    }
    for (const kid of kids.flat()) if (kid !== undefined && kid !== null && kid !== false) el.append(kid);
    return el;
  };
  const trimNumber = (value, digits) => (digits === undefined ? String(value) : String(+Number(value).toFixed(digits)));

  /**
   * Mounts the teaching layer on one figure. Returns a handle; handle.destroy() undoes everything.
   * adapter: { stage?, root?, panel?, set, values?, pose?, takeOver?, tour?, highlight?, hoverTips? }
   */
  function mount(adapter, options = {}) {
    const stage = adapter.stage || document.querySelector(".iso-stage");
    if (mounted.has(stage)) return mounted.get(stage);
    const content = options.content || JSON.parse(document.getElementById("edu-content").textContent);
    const ui = { ...UI, ...(content.ui || {}), tabs: { ...UI.tabs, ...(content.ui?.tabs || {}) } };
    // Where parts live: every <svg> in the stage by default (a figure may stack back SVG, canvas, front SVG).
    const roots = adapter.root ? [].concat(adapter.root) : [...stage.querySelectorAll("svg")];
    const inRoots = (el) => !!el && roots.some((root) => root === el || root.contains(el));
    const plate = stage.closest(".iso-plate") || stage.parentElement;
    const panel = adapter.panel === undefined ? document.querySelector("[data-edu-panel]") : adapter.panel;
    const partAttr = adapter.partAttr || content.partAttr || "data-piece";
    const parts = (content.parts || []).map((part) => (part.select ? part : { ...part, select: `[${partAttr}="${part.id}"]` }));
    const params = content.params || [];
    const steps = content.steps || [];
    const questions = content.questions || [];
    const partById = new Map(parts.map((part) => [part.id, part]));
    const paramById = new Map(params.map((param) => [param.id, param]));
    const state = {};
    const syncers = new Map();
    const refreshers = [];
    const cleanups = [];
    const timers = new Set();
    const created = [];
    const listen = (target, type, fn, opts) => {
      target.addEventListener(type, fn, opts);
      cleanups.push(() => target.removeEventListener(type, fn, opts));
    };
    const later = (fn, ms) => {
      const id = setTimeout(() => { timers.delete(id); fn(); }, ms);
      timers.add(id);
      return id;
    };
    const cancel = (id) => { clearTimeout(id); timers.delete(id); };
    // The tooltip and status line come from eduPage(); a page built another way (React) gets them made here.
    const own = (selector, make) => {
      const found = plate.querySelector(selector);
      if (found) return found;
      const el = make();
      created.push(el);
      return el;
    };
    const tip = own("[data-edu-tip]", () => plate.appendChild(h("div", { class: "edu-tip", "data-edu-tip": "", role: "tooltip", hidden: true })));
    const statusBox = own("[data-edu-status]", () => { const el = h("div", { class: "edu-status", "data-edu-status": "", role: "status", "aria-live": "polite" }); stage.after(el); return el; });

    // ---------- values and templates ----------
    const normal = (raw) => {
      const out = {};
      for (const [key, value] of Object.entries(raw || {})) out[key] = value && typeof value === "object" ? value : { n: typeof value === "number" ? value : NaN, t: String(value) };
      return out;
    };
    const valuesNow = () => normal(adapter.values?.());
    const ratioText = (from, to) => {
      if (!from || !to || !Number.isFinite(from.n) || !Number.isFinite(to.n) || from.n === 0) return "—";
      const ratio = to.n / from.n;
      const round = Math.round(ratio);
      return `${Math.abs(ratio - round) < 0.005 ? round : trimNumber(ratio, 2)}배`;
    };
    // keep a number and its unit on one line: "1.80 W", "5 Ω"
    const glue = (out) => out.replace(/(\d) (?=[A-Za-zΩ%°µ])/g, "$1 ");
    const fill = (text, ctx = {}) => {
      if (!text) return "";
      const now = ctx.now || valuesNow();
      return glue(String(text).replace(/\{(?:(from|to|ratio)\.)?([A-Za-z_]\w*)\}/g, (match, scope, key) => {
        if (scope === "ratio") return ratioText(ctx.from?.[key], ctx.to?.[key]);
        if (key === "answer" && ctx.answer) return ctx.answer;
        const table = scope ? ctx[scope] : now;
        return table?.[key]?.t ?? match;
      }));
    };

    // ---------- tour policy: on at load (unless reduced motion), off for good once the reader acts ----------
    let autoplay = !!adapter.tour && content.autoplay !== false && !still.matches;
    let syncAutoplay = () => {};
    function takeOver() {
      if (autoplay) {
        autoplay = false;
        adapter.tour?.(false);
        syncAutoplay();
      }
      adapter.takeOver?.();
    }
    function setAutoplay(on) {
      autoplay = !!on && !still.matches;
      adapter.tour?.(autoplay);
      syncAutoplay();
    }

    // ---------- highlight ----------
    // Priority: hover > flash > pick (parts list) > guide (step or question).
    // DOM writes stay small: the root gets data-edu-focus, the lit part's elements data-edu-on and their
    // ancestors data-edu-path; CSS (edu.css) dims every sibling along that path. Nothing else is touched,
    // so a 1 MB drawing costs one style recalc, not hundreds of attribute writes.
    const dimMode = content.dim === "fade" ? "fade" : "tone";
    const keepSelector = ["[data-edu-keep]", ...(content.keep || [])].join(",");
    for (const root of roots) {
      for (const el of root.querySelectorAll(keepSelector)) {
        if (el.hasAttribute("data-edu-keep")) continue;
        el.setAttribute("data-edu-keep", "");
        cleanups.push(() => el.removeAttribute("data-edu-keep"));
      }
    }
    const layers = { hover: null, flash: null, pick: null, guide: null };
    let marked = [];
    let lastKey = "";
    const cache = new Map();
    const elementsOf = (ids) => {
      const set = new Set();
      for (const id of ids || []) {
        const part = partById.get(id);
        if (!part) continue;
        let list = cache.get(id);
        if (!list || list.some((el) => !el.isConnected)) {
          list = [];
          for (const root of roots) {
            if (root.matches?.(part.select)) list.push(root);
            list.push(...root.querySelectorAll(part.select));
          }
          cache.set(id, list);
        }
        for (const el of list) set.add(el);
      }
      return set;
    };
    function clearDim() {
      for (const el of marked) {
        el.removeAttribute("data-edu-on");
        el.removeAttribute("data-edu-path");
      }
      marked = [];
      for (const root of roots) root.removeAttribute("data-edu-focus");
    }
    function defaultHighlight(ids) {
      clearDim();
      const on = elementsOf(ids);
      if (!on.size) return;
      for (const el of on) {
        el.setAttribute("data-edu-on", "");
        marked.push(el);
      }
      for (const root of roots) {
        if (on.has(root)) continue; // the whole root is the part: nothing in it dims
        for (const el of on) {

  if (readout.textContent !== text) readout.textContent = text;
  stage.setAttribute("aria-pressed", live() ? "true" : "false");
}
function labels() {
  const m = model();
  plateLabel.textContent = fmtV(S.V) + " · " + fmtA(m.I);
  cellLabel.textContent = fmtV(S.V);
}
function status() {
  if (!edu) return;
  const m = model();
  const times = m.P / RATED_W;
  if (burnt) return edu.status({ level: "danger", text: "필라멘트가 끊어졌습니다. 회로가 열려 전류가 흐르지 않습니다.", action: { label: "새 전구로 바꾸기", run: replaceBulb } });
  const lead = live() ? "전력 " : "닫으면 전력 ";
  if (times > BURN_AT) edu.status({ level: "danger", text: lead + fmtW(m.P) + " · 정격의 " + times.toFixed(1) + "배입니다. 필라멘트가 " + (live() ? "곧 " : "") + "끊어집니다." });
  else if (times > 1.0001) edu.status({ level: "warn", text: lead + fmtW(m.P) + " · 정격 " + fmtW(RATED_W) + "보다 큽니다. 필라멘트가 끊어질 수 있습니다." });
  else edu.status({ level: "ok", text: "안전한 범위입니다 · " + (live() ? "" : "닫으면 ") + fmtA(m.I) + ", " + fmtW(m.P) + " (정격 " + fmtW(RATED_W) + ")" });
}
function burn() {
  burnt = true;
  stress = 0;
  flashAge = still.matches ? -1 : 0;
  stage.setAttribute("data-burnt", "");
  status();
  edu?.refresh();
}
function replaceBulb() {
  burnt = false;
  stress = 0;
  flashAge = -1;
  stage.removeAttribute("data-burnt");
  status();
  edu?.refresh();
  run();
}
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;
  if (touring) { clock += dt; target = clock % 2.8 > 1.6 && clock % 2.8 < 2.5 ? 1 : 0; }
  if (calm) { pos = target; rate = 0; }
  else {
    const stiff = 520, drag = 30;
    for (let i = 0; i < 4; i++) { rate += ((target - pos) * stiff - rate * drag) * dt / 4; pos += rate * dt / 4; }
    if (pos > 1) { pos = 1; rate = -rate * 0.18; }
    if (pos < 0) { pos = 0; rate = -rate * 0.3; }
  }
  const was = on;
  on = pos > 0.985;
  const m = model();
  const overload = live() && m.P > RATED_W * BURN_AT;
  if (overload) { stress += dt; if (calm || stress >= BURN_TIME) burn(); } else stress = 0;
  const want = live() ? 1 : 0;
  glowAt = calm ? want : glowAt + (want - glowAt) * (1 - Math.exp(-dt / (want ? 0.06 : 0.22)));
  if (Math.abs(want - glowAt) < 0.002) glowAt = want;
  if (flashAge >= 0) { flashAge += dt; if (flashAge > 1) flashAge = -1; }
  // Electrons drift at a speed proportional to the current; they stop the moment the loop opens.
  const drift = live() ? m.I * SPEED_PER_AMP : 0;
  speed = calm ? 0 : speed + (drift - speed) * (1 - Math.exp(-dt / 0.15));
  if (Math.abs(drift - speed) < 0.05) speed = calm ? 0 : drift;
  if (S.flow && speed) phase = (phase + speed * dt) % (SPACING * 1000);
  draw();
  if (was !== on) { status(); edu?.refresh(); }
  const settled = !touring && Math.abs(target - pos) < 1e-3 && Math.abs(rate) < 1e-3 && glowAt === want && flashAge < 0 && !overload && (!S.flow || speed === 0);
  frame = visible && !settled ? requestAnimationFrame(tick) : 0;
}
const run = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };
function press(down) {
  if (down) { held = true; toggleTo = !latched; target = 1; }
  else {
    held = false;
    latched = S.mode === "latch" ? toggleTo : false;
    target = latched ? 1 : 0;
  }
  edu?.refresh();
  run();
}
// One press and release, as a finger would (the "tap" action and the latch question use it).
function tap() {
  tapping = true;
  press(true);
  tapTimer = setTimeout(() => { tapping = false; press(false); }, still.matches ? 150 : 420);
}
function modeChanged() {
  const latch = S.mode === "latch";
  if (!latch && latched && !held) { latched = false; target = 0; }
  edu?.hint(latch ? "눌러서 켜기 · 끄기" : "누르고 있기");
  stage.setAttribute("aria-label", latch
    ? "누름 버튼(유지 스위치): 그림을 누르거나 스페이스 키를 누르면 회로가 닫히고, 한 번 더 누르면 열립니다"
    : "누름 버튼(순간 스위치): 그림을 누르고 있거나 스페이스 키를 누르고 있으면 회로가 닫혀 전구가 켜집니다");
}
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);
stage.addEventListener("pointerdown", (event) => { if (event.button > 0) return; edu?.takeOver(); stage.setPointerCapture?.(event.pointerId); press(true); });
stage.addEventListener("pointerup", () => { if (held) press(false); });
stage.addEventListener("pointercancel", () => { if (held) press(false); });
stage.addEventListener("keydown", (event) => { if (event.key === " " || event.key === "Enter") { event.preventDefault(); edu?.takeOver(); if (!event.repeat) press(true); } });
stage.addEventListener("keyup", (event) => { if ((event.key === " " || event.key === "Enter") && held) press(false); });

edu = EDU.mount({
  stage,
  set(id, value) {
    S[id] = value;
    if (id === "V" || id === "R") labels();
    if (id === "mode") modeChanged();
    if (id === "flow") { if (value) stage.setAttribute("data-flow", ""); else stage.removeAttribute("data-flow"); drawnPhase = NaN; }
    status();
    draw();
    run();
  },
  pose(pose) {
    touring = false;
    clearTimeout(tapTimer);
    tapping = false;
    if (burnt) replaceBulb();
    if (pose.reset) { latched = false; held = false; target = 0; }
    if ("pressed" in pose) { latched = false; held = false; target = pose.pressed === true ? 1 : pose.pressed === false ? 0 : Number(pose.pressed); }
    if (pose.tap) tap();
    run();
  },
  action(id) {
    if (id === "tap") { touring = false; clearTimeout(tapTimer); tap(); }
  },
  tour(on) {
    touring = on;
    clock = 0;
    if (!on && !held && !latched && !tapping) target = 0;
    run();
  },
  values() {
    const m = model();
    const now = live() ? m.I : 0;
    const end = endClosed() ? m.I : 0;
    return {
      V: { n: S.V, t: fmtV(S.V) },
      R: { n: S.R, t: S.R + " Ω" },
      I: { n: m.I, t: fmtA(m.I) },
      P: { n: m.P, t: fmtW(m.P) },
      Inow: { n: now, t: fmtA(now) },
      Iend: { n: end, t: fmtA(end) },
      Pr: { n: RATED_W, t: fmtW(RATED_W) },
      circuit: burnt ? "필라멘트가 끊어진 열린 회로" : live() ? "닫힌 회로" : "열린 회로",
    };
  },
});
status();
draw();
</script></body></html>
